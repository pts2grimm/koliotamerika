name: Verify llms.txt links
on:
  push:
    branches: [codex/llms-txt-2026-10-15]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify UTF-8 file and public links
        shell: python
        run: |
          from pathlib import Path
          import urllib.request, urllib.error, re, json
          text = Path("public/llms.txt").read_text(encoding="utf-8")
          assert text.startswith("# Коли от Америка\n\n> ")
          assert len(re.findall(r"^# ", text, re.M)) == 1
          urls = re.findall(r"\]\((https://[^)]+)\)", text)
          assert urls and len(urls) == len(set(urls))
          def request(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 llms-link-check"})
              with urllib.request.urlopen(req, timeout=40) as response:
                  body = response.read()
                  print(json.dumps({"url": url, "status": response.status, "final": response.url, "type": response.headers.get("Content-Type"), "bytes": len(body)}), flush=True)
                  return response.status, response.url, body
          try:
              status, final, body = request("https://koliotamerika.bg/llms.txt")
              print("EXISTING_PUBLIC_LLMS: " + body.decode("utf-8", errors="replace")[:12000])
          except urllib.error.HTTPError as error:
              print("EXISTING_PUBLIC_LLMS_STATUS: " + str(error.code), flush=True)
              assert error.code == 404
          for url in urls:
              assert url.startswith("https://koliotamerika.bg/")
              status, final, body = request(url)
              assert status == 200 and final.rstrip("/") == url.rstrip("/"), url
          print("PASS: UTF-8 Markdown and " + str(len(urls)) + " public links")
