name: Public compression check
on:
  push:
    branches: [codex/compression-check-2026-10-14]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public HTML, CSS and JavaScript compression
        shell: python
        run: |
          import urllib.request, urllib.parse, gzip, json, re, time
          base = "https://koliotamerika.bg"
          def check(path, encoding="gzip"):
              url = urllib.parse.urljoin(base, path)
              req = urllib.request.Request(url, headers={"Accept-Encoding": encoding, "User-Agent": "Mozilla/5.0 CompressionVerification"})
              start = time.monotonic()
              with urllib.request.urlopen(req, timeout=45) as response:
                  raw = response.read()
                  used = response.headers.get("Content-Encoding", "identity")
                  decoded = gzip.decompress(raw) if used == "gzip" else raw
                  row = {"path": path, "requested": encoding, "encoding": used, "status": response.status, "type": response.headers.get("Content-Type"), "wireBytes": len(raw), "decodedBytes": len(decoded) if used in ("gzip", "identity") else None, "vary": response.headers.get("Vary"), "seconds": round(time.monotonic()-start, 2)}
                  if used == "gzip":
                      row["savedPercent"] = round(100*(1-len(raw)/len(decoded)), 1)
                  print(json.dumps(row), flush=True)
                  assert response.status == 200
                  return decoded.decode("utf-8", errors="replace")
          html = check("/")
          assets = re.findall(r'(?:src|href)="([^"]+)"', html)
          for suffix in (".css", ".js"):
              candidates = [p for p in assets if p.startswith("/_next/static/") and suffix in p]
              assert candidates, "Missing " + suffix
              check(candidates[0])
          check("/blog")
          check("/clean-title-kola-ot-amerika")
          check("/", "br, gzip")
