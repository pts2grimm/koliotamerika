name: Verify homepage live preview deployment
on:
  push:
    branches: ['codex/verify-homepage-preview-live-2026-10-26']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read public homepage and protected preview
        run: |
          node --input-type=module <<'NODE'
          const base='https://koliotamerika.bg';
          let ready=false;
          for(let attempt=1;attempt<=20;attempt++){
            try{
              const options=()=>({signal:AbortSignal.timeout(20000),headers:{'User-Agent':'Koliotamerika-deployment-verification'}});
              const response=await fetch(base+'/',options());
              const html=await response.text();
              const preview=await fetch(base+'/home-preview',options());
              const body=await preview.text();
              const result={attempt,homepage:response.status,renderer:html.includes('data-home-preview-capable="v1"'),previewGuest:preview.status,noindex:preview.headers.get('x-robots-tag')?.includes('noindex')===true,privatePreview:!body.includes('home-live-status'),canonical:html.includes('rel="canonical" href="'+base+'/"')||html.includes('rel="canonical" href="'+base+'"')};
              console.log(JSON.stringify(result));
              if(response.ok&&result.renderer&&preview.status===404&&result.noindex&&result.privatePreview&&result.canonical){ready=true;break}
            }catch(error){console.log(JSON.stringify({attempt,error:error.name}))}
            if(attempt<20)await new Promise(resolve=>setTimeout(resolve,30000));
          }
          if(!ready)throw new Error('Homepage preview deployment not yet verified');
          const admin=await fetch(base+'/admin/login',{signal:AbortSignal.timeout(20000)});
          console.log(JSON.stringify({adminLogin:admin.status}));
          if(!admin.ok)throw new Error('Admin login unavailable');
          NODE
