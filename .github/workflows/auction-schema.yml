name: Auction structured data verification
on:
  push:
    branches: ['codex/auction-schema-2026-10-27']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npx tsx --test tests/auction-seo.test.ts
      - run: npm run build
        env:
          PREVIEW_MODE: 'true'
          PAYLOAD_SECRET: auction-schema-isolated-fixture-only
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.auction-seo.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: auction-schema-results
          path: test-results/
          retention-days: 5
