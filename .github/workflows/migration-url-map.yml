name: Migration URL inventory
on:
  workflow_dispatch:
  push:
    branches: ['codex/migration-url-map']
    paths: ['scripts/audit-migration-urls.py', 'reports/url-migration-2026-10-11/source-inventory.json']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/audit-migration-urls.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-url-inventory
          path: url-audit
