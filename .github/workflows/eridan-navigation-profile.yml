name: Verify deployed search recovery
on:
  push:
    branches: ['codex/eridan-navigation-profile']
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          node --input-type=module <<'JS'
          const base='https://darkturquoise-duck-750266.hostingersite.com';
          for(let attempt=1;attempt<=7;attempt++){
            const r=await fetch(base+'/targove?make=BMW&model=X5&site=1',{signal:AbortSignal.timeout(30000)});
            const html=await r.text();
            const assets=[...new Set([...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(m=>m[1]).filter(p=>p.startsWith('/_next/static/')))];
            const js=await Promise.all(assets.map(async p=>(await fetch(base+p,{signal:AbortSignal.timeout(15000)})).text()));
            const deployed=js.some(s=>s.includes('Зареди моделите отново'));
            console.log('DEPLOYED_RECOVERY',JSON.stringify({attempt,status:r.status,cards:(html.match(/class="car-badge"/g)||[]).length,deployed}));
            if(deployed&&r.status===200)process.exit(0);
            if(attempt<7)await new Promise(resolve=>setTimeout(resolve,30000));
          }
          process.exit(1);
          JS
