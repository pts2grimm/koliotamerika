name: Diagnose repeated staging searches
on:
  push:
    branches: ['codex/eridan-navigation-profile']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Read installed Next guides
        run: |
          cat node_modules/next/dist/docs/01-app/03-api-reference/02-components/form.md
          cat node_modules/next/dist/docs/01-app/03-api-reference/04-functions/unstable_cache.md
      - run: npx playwright install --with-deps chromium
      - name: Repeated real browser searches
        run: node work/search-probe.mjs
