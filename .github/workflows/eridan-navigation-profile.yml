name: Compare public auction environments
on:
  push:
    branches: ['codex/eridan-navigation-profile']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          node --input-type=module <<'JS'
          for(const host of ['koliotamerika.bg','darkturquoise-duck-750266.hostingersite.com']){
            const r=await fetch('https://'+host+'/targove?site=2',{signal:AbortSignal.timeout(60000)});
            const html=await r.text();
            const badges=[...html.matchAll(/class="car-badge"[^>]*>([^<]+)</g)].map(m=>m[1]);
            const empty=html.match(/class="empty-state"[\s\S]*?<\/div>/)?.[0]?.replace(/<[^>]+>/g,' ').slice(0,700);
            console.log('ENVIRONMENT',JSON.stringify({host,status:r.status,badges,empty,eridanFields:html.includes('name="vehicle_type"')}));
          }
          JS
