name: Verify reported filter on deployed staging
on:
  push:
    branches: ['codex/eridan-navigation-profile']
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const url='https://darkturquoise-duck-750266.hostingersite.com/targove?make=BMW&model=3+SERIES&year_from=2013&year_to=&vehicle_type=&site=1&fuel=Gasoline';
          const r=await fetch(url,{signal:AbortSignal.timeout(60000)});
          const html=await r.text();
          const badges=[...html.matchAll(/class="car-badge"[^>]*>([^<]+)</g)].map(m=>m[1]);
          const field=html.includes('name="vehicle_type"');
          console.log('DEPLOYED_EXACT',JSON.stringify({status:r.status,badges,vehicleTypeField:field,unavailableNotice:html.includes('auction-filter-availability')}));
          assert.equal(r.status,200);
          assert(badges.length>0);
          assert(badges.every(s=>s==='COPART'));
          assert.equal(field,false);
          JS
