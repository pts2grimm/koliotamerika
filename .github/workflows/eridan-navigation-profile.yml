name: Verify deterministic catalogue outage recovery
on:
  push:
    branches: ['codex/eridan-navigation-profile']
permissions:
  contents: read
jobs:
  contracts-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Production build for isolated browser tests
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-eridan
          PREVIEW_MODE: 'true'
          PAYLOAD_SECRET: eridan-build-fixture-secret-no-real-data
          NEXT_PUBLIC_SERVER_URL: http://localhost:3100
          SITE_INDEXABLE: 'false'
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.eridan.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: eridan-browser-results
          path: test-results/
          retention-days: 5
