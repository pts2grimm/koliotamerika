name: Verify full mixed Eridan catalogue
on:
  push:
    branches: ['codex/eridan-navigation-profile']
permissions:
  contents: read
jobs:
  full-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: node --import tsx scripts/profile-eridan-auctions.ts
        env:
          ERIDAN_API_KEY: ${{ secrets.ERIDAN_API_KEY }}
