name: Verify exact Copart filter and auction switching
on:
  push:
    branches: ['codex/eridan-navigation-profile']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: node --import tsx scripts/inspect-copart-filter.ts
        env:
          ERIDAN_API_KEY: ${{ secrets.ERIDAN_API_KEY }}
