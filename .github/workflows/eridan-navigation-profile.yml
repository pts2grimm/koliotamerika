name: Inspect public catalogue failure
on:
  push:
    branches: ['codex/eridan-navigation-profile']
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          node --input-type=module <<'JS'
          const start=Date.now();
          const r=await fetch('https://darkturquoise-duck-750266.hostingersite.com/targove',{signal:AbortSignal.timeout(60000)});
          const html=await r.text();
          const plain=html.replace(/<script[\s\S]*?<\/script>/g,'').replace(/<style[\s\S]*?<\/style>/g,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
          console.log('PUBLIC',JSON.stringify({status:r.status,ms:Date.now()-start,cardMentions:(html.match(/auction-card/g)||[]).length,text:plain.slice(-11000)}));
          JS
