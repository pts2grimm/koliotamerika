name: Interior landing design checks
on:
  push:
    branches: [codex/landing-design]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - run: npm run build
        env:
          PREVIEW_MODE: 'true'
          PAYLOAD_SECRET: ci-landing-design-only-not-a-live-secret
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Browser checks with imported page content
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { spawnSync } from 'node:child_process';
          const result = spawnSync('npx', ['playwright', 'test', '--config=playwright.landing.config.ts', '--reporter=line'], { stdio: 'inherit', env: { ...process.env, CHROMIUM_PATH: chromium.executablePath() } });
          process.exit(result.status ?? 1);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-browser-results
          path: test-results
