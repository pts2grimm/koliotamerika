name: Blog SEO verification
on:
  push:
    branches: [codex/blog-seo-foundation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Installed Next.js SEO documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('node_modules/next/dist/docs')
          guides = [p for p in root.rglob('*.md*') if any(s in p.name for s in ['generate-metadata', 'json-ld', 'metadata-and-og-images'])]
          for guide in guides:
              print('GUIDE:', guide)
              print(guide.read_text())
          if not guides:
              raise SystemExit('Installed documentation not found')
          PY
      - run: npm test
      - run: npm run build
        env:
          PREVIEW_MODE: 'true'
          PAYLOAD_SECRET: ci-blog-seo-only-not-a-live-secret
      - run: npm run typecheck
