name: Blog SEO verification
on:
  push:
    branches: [codex/blog-seo-foundation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Installed Next.js SEO documentation
        run: |
          rg --files node_modules/next/dist/docs | rg '(metadata|json-ld|generate-metadata|search-params)'
          for guide in $(rg --files node_modules/next/dist/docs | rg '/(generate-metadata|json-ld|metadata-and-og-images)\.md$'); do
            cat "$guide"
          done
      - run: npm test
      - run: npm run build
        env:
          PREVIEW_MODE: 'true'
          PAYLOAD_SECRET: ci-blog-seo-only-not-a-live-secret
      - run: npm run typecheck
