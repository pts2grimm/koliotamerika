name: Inspect Eridan lot 57397516
on:
  push:
    branches: ['codex/inspect-eridan-57397516-20261013']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/inspect-eridan-57397516.mjs
