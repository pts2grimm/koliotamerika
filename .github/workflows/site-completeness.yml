name: Capture old-site completeness
on:
  push:
    branches: ['codex/site-completeness']
    paths: ['scripts/capture-site-completeness.mjs', '.github/workflows/site-completeness.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: node scripts/capture-site-completeness.mjs
      - name: Preserve public inventory on the audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/site-completeness/inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "Record fresh public WordPress inventory"
            git push origin HEAD:codex/site-completeness
          fi
      - name: Read installed Next image documentation
        run: find node_modules/next/dist/docs -iname '*image*' -type f -exec cat {} +
      - uses: actions/upload-artifact@v4
        with:
          name: site-completeness
          path: reports/site-completeness/
