name: Consent chart interaction verification
on:
  push:
    branches: ['codex/consent-chart-hover-2026-10-27']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: node tests/consent-chart.browser.mjs
      - run: npm run build
        env:
          PREVIEW_MODE: 'true'
          PAYLOAD_SECRET: isolated-consent-chart-ci-only
      - run: npm run typecheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consent-chart-review
          path: test-results/
          retention-days: 5
