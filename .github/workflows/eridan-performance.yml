name: Read installed Next rendering guides
on:
  push:
    branches: ['codex/eridan-performance-check']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Read installed Next guides
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('node_modules/next/dist/docs')
          paths=[p for p in root.rglob('*') if p.is_file() and ('loading' in p.stem or p.stem == 'image' or 'unstable_cache' in p.stem)]
          print('PATHS',*[str(p) for p in paths],sep='\n')
          for p in paths:
              print('GUIDE',p)
              print(p.read_text()[:30000])
          assert paths
          PY
