name: Eridan detail and image diagnosis
on:
  push:
    branches: ['codex/eridan-performance-check']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Read installed Next guides
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('node_modules/next/dist/docs')
          for name in ['loading','image']:
              paths=list(root.rglob(name+'.mdx'))
              for p in paths:
                  if 'app/' in str(p):
                      print('GUIDE',p)
                      print(p.read_text()[:22000])
                      break
          PY
      - run: python3 -m pip install Pillow
      - name: Measure detail requests and image dimensions
        env:
          ERIDAN_API_KEY: ${{ secrets.ERIDAN_API_KEY }}
        run: |
          python3 -u - <<'PY'
          import json, os, time, urllib.request, urllib.parse, re
          token=os.environ['ERIDAN_API_KEY']
          base='https://catalog.eridan.software/api'
          row=None
          for ordering in ['-updated_at','-id']:
              start=time.monotonic()
              params={'lot_number':'67798546','auction':'copart','ordering':ordering,'page':'1','page_size':'10'}
              req=urllib.request.Request(base+'/lots?'+urllib.parse.urlencode(params),headers={'Accept':'application/json','Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
              print('EXACT_LOT',ordering,'ms',round((time.monotonic()-start)*1000),'items',len(data['items']))
              if data['items']: row=data['items'][0]
          if row:
              for label,url in [('thumb',row.get('thumb_url')),('full',(row.get('images') or [None])[0])]:
                  if not url: continue
                  start=time.monotonic()
                  try:
                      with urllib.request.urlopen(url,timeout=20) as r: body=r.read()
                      from PIL import Image
                      from io import BytesIO
                      print('IMAGE',label,'pixels',Image.open(BytesIO(body)).size,'bytes',len(body),'ms',round((time.monotonic()-start)*1000))
                  except Exception as e: print('IMAGE_ERROR',label,type(e).__name__)
          stage='https://darkturquoise-duck-750266.hostingersite.com'
          for path in ['/','/targove/kola?lot=67798546&site=1','/targove/kola?lot=67798546&site=1']:
              start=time.monotonic()
              try:
                  with urllib.request.urlopen(stage+path,timeout=60) as r:
                      ttfb=round((time.monotonic()-start)*1000);body=r.read().decode()
                  print('STAGE',path,'ttfb_ms',ttfb,'total_ms',round((time.monotonic()-start)*1000),'bytes',len(body.encode()))
              except Exception as e: print('STAGE_ERROR',path,type(e).__name__)
          
          PY
