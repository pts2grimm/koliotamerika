name: Homepage and pricing verification
on:
  push:
    branches: ['codex/home-clarity']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npx tsx scripts/check-content-external-links.ts
      - run: npm test
      - run: npm run build
        env:
          PREVIEW_MODE: 'true'
          PAYLOAD_SECRET: ci-content-review-only-not-live-secret
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Crawl public content and verify mobile layout
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { spawnSync } from 'node:child_process';
          const result = spawnSync('npx', ['playwright', 'test', '--config=playwright.home-clarity.config.ts', '--reporter=line'], { stdio:'inherit', env:{...process.env, CHROMIUM_PATH:chromium.executablePath()} });
          process.exit(result.status ?? 1);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-clarity-results
          path: test-results
