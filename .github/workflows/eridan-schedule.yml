name: Eridan schedule diagnosis
on:
  push:
    branches: ['codex/eridan-auction-dates']
permissions:
  contents: read
jobs:
  live-schedule:
    if: contains(github.event.head_commit.message, '[schedule-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: node --import tsx scripts/check-eridan-schedule.ts
        env:
          ERIDAN_API_KEY: ${{ secrets.ERIDAN_API_KEY }}
