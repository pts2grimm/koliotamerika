name: Verify deployed auction schema
on:
  push:
    branches: ['codex/image-diagnostics-2026-10-27']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify public auction structured data
        run: |
          node --input-type=module <<'JS'
          async function check(lot,site){
           try{
            const url='https://koliotamerika.bg/targove/kola?lot='+lot+'&site='+site;
            const r=await fetch(url,{signal:AbortSignal.timeout(20000)});
            const html=await r.text();
            const blocks=[...html.matchAll(/<script\b[^>]*type="application\/ld\+json"[^>]*>([\s\S]*?)<\/script>/g)].map(m=>JSON.parse(m[1]));
            const nodes=blocks.flatMap(b=>b['@graph']||[b]);
            const productNodes=nodes.filter(n=>['Vehicle','Product','Car'].includes(n['@type'])).length;
            const pageNodes=nodes.filter(n=>n['@type']==='WebPage').length;
            console.log('SCHEMA',JSON.stringify({url,status:r.status,title:html.match(/<title>(.*?)<\/title>/)?.[1],types:nodes.map(n=>n['@type']),productNodes,pageNodes}));
            return r.ok&&pageNodes>0&&productNodes===0;
           }catch(e){console.log('FETCH_ERROR',JSON.stringify({lot,name:e.name,message:e.message}));return false}
          }
          let verified=false;
          for(let attempt=1;attempt<=12;attempt++){
           if(await check('32894932','2')){
            const second=await check('41275545','2'),third=await check('54155906','1');
            if(second&&third){verified=true;break}
           }
           if(attempt<12)await new Promise(resolve=>setTimeout(resolve,20000));
          }
          console.log('DEPLOY_VERIFIED',verified);
          
          JS
