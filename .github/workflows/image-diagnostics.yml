name: Public text encoding diagnosis
on:
  push:
    branches: ['codex/image-diagnostics-2026-10-27']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect public text responses
        run: |
          node --input-type=module <<'JS'
          for (const path of ['/llms.txt', '/llms.txt?encoding-check=20261027b']) {
            const r=await fetch('https://koliotamerika.bg'+path,{signal:AbortSignal.timeout(20000),headers:{'Cache-Control':'no-cache'}});
            const b=new Uint8Array(await r.arrayBuffer());
            const h=Object.fromEntries(['content-type','cache-control','age','server','etag','last-modified','x-cache','x-hcdn-cache-status'].map(k=>[k,r.headers.get(k)]));
            console.log('ENCODING',JSON.stringify({path,status:r.status,headers:h,bytes:[...b.slice(0,30)],text:new TextDecoder().decode(b).slice(0,100)}));
          }
          JS
