name: Public auction schema diagnosis
on:
  push:
    branches: ['codex/image-diagnostics-2026-10-27']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read public auction structured data
        run: |
          node --input-type=module <<'JS'
          const samples=[['32894932','2'],['41275545','2'],['54155906','1']];
          for(const [lot,site] of samples){
           try{
            const url='https://koliotamerika.bg/targove/kola?lot='+lot+'&site='+site;
            const r=await fetch(url,{signal:AbortSignal.timeout(25000)});
            const html=await r.text();
            const blocks=[...html.matchAll(/<script\b[^>]*type="application\/ld\+json"[^>]*>([\s\S]*?)<\/script>/g)].map(m=>JSON.parse(m[1]));
            const nodes=blocks.flatMap(b=>b['@graph']||[b]);
            console.log('SCHEMA',JSON.stringify({url,status:r.status,title:html.match(/<title>(.*?)<\/title>/)?.[1],types:nodes.map(n=>n['@type']),productNodes:nodes.filter(n=>['Vehicle','Product','Car'].includes(n['@type'])).length,pageNodes:nodes.filter(n=>n['@type']==='WebPage').length}));
           }catch(e){console.log('FETCH_ERROR',JSON.stringify({lot,name:e.name,message:e.message}))}
          }
          JS
