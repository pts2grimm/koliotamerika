name: Page SEO verification
on:
  push:
    branches: ['codex/page-seo']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Inspect installed framework contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('node_modules/next/dist/docs')
          for term in ['generate-metadata', 'robots', 'not-found']:
            for p in root.rglob('*'+term+'*'):
              if p.is_file():
                print('\nFILE',p)
                print(p.read_text()[:24000])
          for p in Path('node_modules/payload/dist').rglob('*'):
            if p.is_file() and p.suffix in ['.js','.ts'] and ('kv' in p.parts or p.name in ['getKVAdapter.js','getKVAdapter.d.ts']):
              print('\nFILE',p)
              print(p.read_text()[:20000])
          PY
