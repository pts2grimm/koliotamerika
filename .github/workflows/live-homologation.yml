name: Live homologation read-only check
on:
  push:
    branches: ['codex/live-homologation-*']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public pages and redirects
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, json
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          paths=['/homologacia','/homologacia-na-koli','/tehnotest-za-avtomobili','/tehnotest','/tag/tehnotest','/tag/individualno-odobryavane','/blog','/sitemap.xml','/wp-content/uploads/2022/09/tehnotest.jpg']
          for path in paths:
              request=urllib.request.Request('https://koliotamerika.bg'+path,headers={'User-Agent':'KoliotamerikaDeploymentCheck/1.0','Cache-Control':'no-cache'})
              try:
                  response=opener.open(request,timeout=30)
              except urllib.error.HTTPError as error:
                  response=error
              except Exception as error:
                  print(json.dumps({'path':path,'error':str(error)},ensure_ascii=False),flush=True)
                  continue
              body=response.read().decode('utf-8','replace')
              print(json.dumps({'path':path,'status':response.status,'location':response.headers.get('Location'),'age':response.headers.get('Age'),'cache':response.headers.get('X-Hcdn-Cache-Status'),'h1':re.findall(r'<h1[^>]*>(.*?)</h1>',body,re.S),'title':re.findall(r'<title[^>]*>(.*?)</title>',body,re.S),'retired_name_count':len(re.findall(r'технотест|tehnotest|technotest',body,re.I)),'new_copy':'Какви документи да подготвиш за предварителния преглед' in body},ensure_ascii=False),flush=True)
          PY
