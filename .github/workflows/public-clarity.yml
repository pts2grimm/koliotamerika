name: Public clarity audit
on:
  push:
    branches: ['codex/public-clarity-audit']
    paths: ['scripts/audit-public-clarity.mjs', '.github/workflows/public-clarity.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: node scripts/audit-public-clarity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-clarity
          path: reports/public-clarity/
