name: Contact phone verification
on:
  push:
    branches: ['codex/contact-phone-2026-10-30']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - name: Verify contact upgrade on an isolated database
        run: npx tsx tests/fixtures/contact-phone.ts
        env:
          PREVIEW_MODE: 'true'
          PAYLOAD_SECRET: ci-contact-phone-only-not-live-secret
      - run: npm run build
        env:
          PREVIEW_MODE: 'true'
          PAYLOAD_SECRET: ci-contact-phone-only-not-live-secret
      - run: npm run typecheck
