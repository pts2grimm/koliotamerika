name: Eridan sorting verification
on:
  push:
    branches: ['codex/eridan-catalogue-sorting']
permissions:
  contents: read
jobs:
  live-ordering:
    if: contains(github.event.head_commit.message, '[sort-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: node --import tsx scripts/check-eridan-sort-live.ts
        env:
          ERIDAN_API_KEY: ${{ secrets.ERIDAN_API_KEY }}
