name: Consent analytics and admin verification
on:
  push:
    branches: ['codex/consent-admin-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Generate Payload artifacts
        run: npm run generate:types && npm run generate:importmap
        env:
          PREVIEW_MODE: 'true'
          PAYLOAD_SECRET: isolated-consent-ci-not-a-live-secret
      - name: Export generated files for review
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          for(const file of ['src/payload-types.ts','src/app/(payload)/admin/importMap.js']) {
            console.log('GENERATED_FILE ' + JSON.stringify({path:file,content:readFileSync(file,'utf8')}));
          }
          JS
      - run: npx tsx --test tests/consent-audit.test.ts tests/integrations.test.ts tests/integration-settings.test.ts tests/migrations.test.ts tests/account-validation.test.ts
      - name: Check unchanged Eridan fixture at base
        uses: actions/checkout@v4
        with:
          ref: bf9f6429bf5587dbfc188eb9adeb0a581b2156ab
          path: baseline
      - name: Record baseline result for date-sensitive catalogue fixture
        continue-on-error: true
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" baseline/node_modules
          cd baseline
          node --import tsx --test --test-name-pattern="the user-provided JSON maps" tests/eridan.test.ts
      - name: Remove isolated baseline checkout
        run: rm -rf baseline
      - run: npm run build
        env:
          PREVIEW_MODE: 'true'
          PAYLOAD_SECRET: isolated-consent-ci-not-a-live-secret
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Consent and admin browser checks
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { spawnSync } from 'node:child_process';
          const result=spawnSync('npx',['playwright','test','--config=playwright.consent-admin.config.ts','--reporter=line'],{stdio:'inherit',env:{...process.env,CHROMIUM_PATH:chromium.executablePath()}});
          process.exit(result.status??1);
          JS
      - name: Export visual review
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {existsSync,readFileSync} from 'node:fs';
          for(const path of ['test-results/admin-overview-desktop.jpg','test-results/admin-overview-mobile.jpg','test-results/admin-overview-other-theme.jpg'])
            if(existsSync(path)) console.log('REVIEW_IMAGE '+JSON.stringify({path,base64:readFileSync(path).toString('base64')}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consent-admin-results
          path: |
            test-results
            src/payload-types.ts
            src/app/(payload)/admin/importMap.js
