name: Eridan model family verification
on:
  push:
    branches: ['codex/eridan-model-families']
permissions:
  contents: read
jobs:
  taxonomy:
    if: contains(github.event.head_commit.message, '[taxonomy]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: node --import tsx scripts/check-eridan-model-taxonomy.ts
        env:
          ERIDAN_API_KEY: ${{ secrets.ERIDAN_API_KEY }}
