name: Admin password reset delivery check
on:
  push:
    branches: [codex/admin-check-2026-10-16]
permissions:
  contents: read
jobs:
  reset:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Request one administrator password recovery email'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Submit one recovery request and record only safe response metadata
        shell: python
        run: |
          import urllib.request, urllib.error, json, time, datetime
          url = "https://koliotamerika.bg/api/users/forgot-password"
          data = json.dumps({"email":"office@koliotamerika.bg"}).encode()
          req = urllib.request.Request(url, data=data, method="POST", headers={"Content-Type":"application/json","Accept":"application/json","Origin":"https://koliotamerika.bg","Referer":"https://koliotamerika.bg/admin/forgot","User-Agent":"Mozilla/5.0 AdminRecoveryCheck"})
          started = datetime.datetime.now(datetime.timezone.utc).isoformat()
          now = time.monotonic()
          try:
              try:
                  response = urllib.request.urlopen(req, timeout=70)
              except urllib.error.HTTPError as error:
                  response = error
              raw = response.read()
              parsed = json.loads(raw) if "json" in response.headers.get("Content-Type","") else {}
              messages = [str(x.get("message","")) for x in parsed.get("errors",[]) if isinstance(x,dict)]
              joined = " ".join(messages).lower()
              flags = {name: any(term in joined for term in terms) for name, terms in {
                "smtp": ["smtp","eauth","envelope"],
                "database": ["sqlite","sql","libsql","database","transaction"],
                "rateLimit": ["too many","rate limit"],
                "permission": ["forbidden","not allowed","unauthorized"],
                "serverError": ["something went wrong","internal server"],
              }.items()}
              print(json.dumps({"startedUTC":started,"httpStatus":response.status,"seconds":round(time.monotonic()-now,2),"jsonKeys":list(parsed.keys()),"errorCount":len(messages),"flags":flags}),flush=True)
          except Exception as error:
              print(json.dumps({"startedUTC":started,"seconds":round(time.monotonic()-now,2),"transportErrorType":type(error).__name__}),flush=True)
              raise SystemExit(1)
