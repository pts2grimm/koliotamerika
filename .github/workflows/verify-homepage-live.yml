name: Verify homepage editor deployment
on:
  push:
    branches: ['codex/verify-homepage-live-2026-10-26']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read public homepage and editor content
        run: |
          node --input-type=module <<'NODE'
          const base='https://koliotamerika.bg';
          let ready=false;
          for(let attempt=1;attempt<=20;attempt++){
            try{
              const options={signal:AbortSignal.timeout(20000),headers:{'User-Agent':'Koliotamerika-deployment-verification'}};
              const api=await fetch(base+'/api/globals/homepage?depth=0',options);
              const response=await fetch(base+'/',{...options,signal:AbortSignal.timeout(20000)});
              const html=await response.text();
              const content=api.ok?await api.json():null;
              const result={attempt,homepage:response.status,editor:api.status,rendered:html.includes('data-home-editor="v1"'),seo:content?.seo?.title===html.match(/<title>(.*?)<\/title>/s)?.[1],hero:html.includes('Коли от Америка и Канада.'),canonical:new URL(html.match(/rel="canonical" href="([^"]+)"/)?.[1]||'https://invalid.test').href===base+'/',faq:content?.faq?.items?.length,photos:content?.trust?.photos?.length};
              console.log(JSON.stringify(result));
              if(response.ok&&api.ok&&result.rendered&&result.seo&&result.hero&&result.canonical&&result.faq>=4&&result.photos===3){ready=true;break}
            }catch(error){console.log(JSON.stringify({attempt,error:error.name}))}
            if(attempt<20)await new Promise(resolve=>setTimeout(resolve,30000));
          }
          if(!ready)throw new Error('Homepage editor deployment not yet verified');
          const admin=await fetch(base+'/admin/login',{signal:AbortSignal.timeout(20000)});
          console.log(JSON.stringify({adminLogin:admin.status}));
          if(!admin.ok)throw new Error('Admin login unavailable');
          NODE
