name: Integration framework reference
on:
  push:
    branches: ['codex/admin-integrations']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Installed Next documentation
        run: |
          find node_modules/next/dist/docs -type f | grep -E '(script|after|server-and-client-components)'
          find node_modules/next/dist/docs -type f | grep -E '(01-app/.*(script|after)\\.md$|server-and-client-components\\.md$)' | xargs cat
