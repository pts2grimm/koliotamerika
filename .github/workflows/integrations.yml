name: Admin integrations verification
on:
  push:
    branches: ['codex/admin-integrations']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run generate:types
        env:
          PREVIEW_MODE: 'true'
          PAYLOAD_SECRET: ci-integrations-only-not-live-secret
      - name: Generated types for review
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          console.log('GENERATED_TYPES_START');
          console.log(readFileSync('src/payload-types.ts','utf8'));
          console.log('GENERATED_TYPES_END');
          JS
      - run: npm run typecheck
