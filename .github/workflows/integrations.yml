name: Integration framework reference
on:
  push:
    branches: ['codex/admin-integrations']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Installed Next documentation
        run: |
          cat node_modules/next/dist/docs/01-app/03-api-reference/04-functions/after.md
          cat node_modules/next/dist/docs/01-app/03-api-reference/02-components/script.md
          cat node_modules/next/dist/docs/01-app/01-getting-started/05-server-and-client-components.md
