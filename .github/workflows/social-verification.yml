name: Facebook scheduling verification
on:
  push:
    branches: ['codex/facebook-scheduling-2026-10-24', 'codex/vehicle-social-copy-2026-10-28']
permissions:
  contents: read
concurrency:
  group: facebook-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: 'true'
      DATABASE_PROVIDER: postgres
      DATABASE_URI: postgresql://postgres:isolated-test-only@127.0.0.1:5432/postgres
      PAYLOAD_SECRET: social-fixture-not-production
      PAYLOAD_MIGRATING: 'true'
      PREVIEW_MODE: 'false'
      CUSTOMER_ACCOUNTS_ENABLED: 'true'
      ALLOW_ADMIN_SETUP: 'true'
      SITE_INDEXABLE: 'false'
      NEXT_PUBLIC_SERVER_URL: http://localhost:3100
      MEDIA_DIR: /tmp/koa-social-media
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: node --import tsx --test tests/social.test.ts tests/social-vehicle-message.test.ts
      - run: node --import tsx scripts/prepare-postgres.ts
      - run: node --import tsx tests/fixtures/social-store.ts
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 4
      - run: npx playwright test --config=playwright.social.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: social-test-results
          path: test-results/
          retention-days: 5
