name: Domain connection check
on:
  push:
    branches: ['codex/domain-connection-check']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read Eridan public API documentation without credentials
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, urllib.parse, re, json
          url='https://catalog.eridan.software/api/docs'
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:
                  body=r.read().decode()
                  print('DOCS',json.dumps({'status':r.status,'url':r.url,'contentType':r.headers.get('Content-Type'),'title':re.findall('<title>(.*?)</title>',body,re.S),'bytes':len(body)}))
                  scripts=re.findall('<script[^>]+src=["\\\']([^"\\\']+)',body)
                  print('SCRIPTS',json.dumps(scripts))
                  print('INLINE',body[-5000:])
              for src in scripts:
                  if 'init' not in src: continue
                  target=urllib.parse.urljoin(url+'/',src)
                  if urllib.parse.urlparse(target).netloc!='catalog.eridan.software': continue
                  with urllib.request.urlopen(target,timeout=30) as r:
                      code=r.read().decode()
                      print('INIT_URL',target,'STATUS',r.status)
                      start=re.search(r'(?:let|var|const) options\\s*=\\s*',code)
                      if start:
                          try:
                              options,_=json.JSONDecoder().raw_decode(code[start.end():])
                              doc=options.get('swaggerDoc',{})
                              print('OPENAPI',json.dumps({'version':doc.get('openapi'),'info':doc.get('info'),'servers':doc.get('servers'),'security':doc.get('security'),'securitySchemes':doc.get('components',{}).get('securitySchemes'),'paths':{p:{m:{k:v.get(k) for k in ['summary','description','security','parameters','requestBody','responses']} for m,v in methods.items() if isinstance(v,dict)} for p,methods in doc.get('paths',{}).items()}},ensure_ascii=False))
                          except Exception as e: print('PARSE_ERROR',str(e)); print(code[:18000])
                      else: print(code[:18000])
          except urllib.error.HTTPError as e: print('HTTP_ERROR',e.code,e.reason)
          except Exception as e: print('ERROR',type(e).__name__,str(e))
          PY
