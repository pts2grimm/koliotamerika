name: Domain connection check
on:
  push:
    branches: ['codex/domain-connection-check']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public tracking configuration and latest blog posts
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, json, datetime
          print('CHECK_TIME',datetime.datetime.now(datetime.timezone.utc).isoformat())
          for path in ['/', '/?integration_check=20261012', '/blog', '/api/pages?where%5Bkind%5D%5Bequals%5D=article&sort=-publishedAt&limit=8&depth=0', '/clean-title-kola-ot-amerika', '/proverka-servizni-akcii-vin-sasht']:
              try:
                  with urllib.request.urlopen(urllib.request.Request('https://koliotamerika.bg'+path,headers={'Cache-Control':'no-cache'}),timeout=25) as r:
                      raw=r.read().decode()
                      print('PUBLIC',path,r.status,'cache',{k:v for k,v in r.headers.items() if k.lower() in ['age','cache-control','x-cache','x-hcdn-cache-status']})
                      if path.startswith('/api/pages'):
                          data=json.loads(raw)
                          print('ARTICLES',json.dumps({'total':data.get('totalDocs'),'docs':[{k:d.get(k) for k in ['title','slug','status','publishedAt']} for d in data.get('docs',[])]},ensure_ascii=False))
                      else:
                          body=raw.replace(chr(92)+chr(34),chr(34))
                          config=re.findall('"config":(\\{[^{}]*"installation"[^{}]*\\})',body)
                          print('TRACKING', config[:1])
                          if path=='/blog': print('BLOG_HEADINGS', re.findall('<h[123][^>]*>(.*?)</h[123]>',raw)[:12])
              except urllib.error.HTTPError as e: print('PUBLIC',path,'HTTP_ERROR',e.code)
              except Exception as e: print('PUBLIC',path,'ERROR',str(e))
          PY
