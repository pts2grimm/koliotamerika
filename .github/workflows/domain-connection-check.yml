name: Domain connection check
on:
  push:
    branches: ['codex/domain-connection-check']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify canonical host on the deployed site
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, time, json, datetime
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def check(url):
              try:
                  r = opener.open(urllib.request.Request(url, headers={'Cache-Control':'no-cache'}), timeout=20)
              except urllib.error.HTTPError as e:
                  r = e
              result = {'url':url, 'status':r.status, 'location':r.headers.get('Location'), 'robots':r.headers.get('X-Robots-Tag')}
              r.close()
              print(json.dumps(result), flush=True)
              return result
          print(datetime.datetime.now(datetime.timezone.utc).isoformat(), flush=True)
          ready = False
          for attempt in range(1):
              result = check('https://www.koliotamerika.bg/?canonical_check=1')
              if result['status'] == 308 and result['location'] in ['https://koliotamerika.bg/?canonical_check=1', 'https://koliotamerika.bg?canonical_check=1']:
                  ready = True
                  break
              if attempt < 0:
                  time.sleep(20)
          if ready:
              for path in ['/morski-transport-na-avtomobili-ot-sasht?utm_source=canonical-check', '/sitemap.xml', '/api/media/file/Remove%20background%20project%20%282%29.png']:
                  check('https://www.koliotamerika.bg'+path)
          check('https://koliotamerika.bg/')
          check('https://koliotamerika.bg/robots.txt')
          check('https://koliotamerika.bg/sitemap.xml')
          print('CANONICAL_REDIRECT_DEPLOYED', ready, flush=True)
          PY
