name: Read-only domain connection diagnostics
on:
  push:
    branches: ['codex/domain-connection-check']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify the new public upload
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,datetime,json,hashlib,time
          url='https://koliotamerika.bg/api/media/file/Remove%20background%20project%20%282%29.png'
          for target in [url,url+'?verify='+str(int(time.time()))]:
           try:
            req=urllib.request.Request(target,headers={'User-Agent':'Koliotamerika media verification','Cache-Control':'no-cache'})
            try: response=urllib.request.urlopen(req,timeout=25)
            except urllib.error.HTTPError as e: response=e
            with response as r:
             data=r.read(16777217)
             print('MEDIA_CHECK '+json.dumps({'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'url':target,'status':r.status,'finalURL':r.url,'contentType':r.headers.get('content-type'),'bytesRead':len(data),'truncated':len(data)>16777216,'pngSignature':data.startswith(bytes([137,80,78,71,13,10,26,10])),'sha256':hashlib.sha256(data).hexdigest(),'errorText':data[:400].decode('utf-8','replace') if r.status>=400 else None}),flush=True)
           except Exception as e: print('MEDIA_ERROR '+str(e),flush=True)
          
          PY
