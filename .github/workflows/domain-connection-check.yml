name: Read-only domain connection diagnostics
on:
  push:
    branches: ['codex/domain-connection-check']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect authoritative DNS and DNSSEC without changes
        run: |
          python3 - <<'PY'
          import concurrent.futures,json,urllib.request,subprocess,shutil
          def doh(item):
           typ,cd=item
           url='https://dns.google/resolve?name=koliotamerika.bg&type='+typ+'&cd='+cd
           try:
            with urllib.request.urlopen(url,timeout=15) as r: data=json.load(r)
            print('DOH '+json.dumps({'type':typ,'cd':cd,'result':data}),flush=True)
           except Exception as e: print('ERROR '+str(e),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool: list(pool.map(doh,[(t,c) for t in ['NS','A','MX','DS'] for c in ['false','true']]))
          def query(item):
           server,typ=item
           try:
            p=subprocess.run(['dig','@'+server,'koliotamerika.bg',typ,'+norecurse','+time=3','+tries=1'],capture_output=True,text=True,timeout=10)
            print('DIG '+json.dumps({'server':server,'type':typ,'output':p.stdout,'error':p.stderr}),flush=True)
           except Exception as e: print('ERROR '+str(e),flush=True)
          if shutil.which('dig'):
           with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool: list(pool.map(query,[(s,t) for s in ['atlas.dns-parking.com','hyperion.dns-parking.com','ns1.dns-parking.com','ns2.dns-parking.com'] for t in ['SOA','A','MX']]))
          
          PY
