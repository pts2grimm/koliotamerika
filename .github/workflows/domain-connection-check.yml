name: Domain connection check
on:
  push:
    branches: ['codex/domain-connection-check']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Diagnose sitemap HTTP, XML and public DNS
        run: |
          python3 - <<'PY'
          import subprocess, urllib.request, urllib.error, xml.etree.ElementTree as ET, json, datetime, concurrent.futures
          print('CHECK_TIME', datetime.datetime.now(datetime.timezone.utc).isoformat(), flush=True)
          queries = [(s,t) for s in ['8.8.8.8','1.1.1.1','atlas.dns-parking.com','hyperion.dns-parking.com'] for t in ['NS','A','AAAA','SOA']]
          def dns(q):
              s,t=q
              p=subprocess.run(['dig','@'+s,'koliotamerika.bg',t,'+time=3','+tries=1','+noall','+comments','+answer'],capture_output=True,text=True,timeout=10)
              return {'server':s,'type':t,'result':p.stdout.strip()}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              for result in pool.map(dns,queries): print('DNS',json.dumps(result),flush=True)
          requests = [(path,ua) for path in ['/sitemap.xml','/robots.txt','/sitemap_index.xml'] for ua in ['Mozilla/5.0','Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)']]
          def http(item):
              path,ua=item
              url='https://koliotamerika.bg'+path
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':ua,'Cache-Control':'no-cache'}),timeout=25) as r:
                      body=r.read()
                      result={'path':path,'user_agent':ua,'status':r.status,'final_url':r.url,'headers':{k:v for k,v in r.headers.items() if k.lower() in ['content-type','content-encoding','content-length','x-robots-tag','server','cache-control','age','vary']},'bytes':len(body)}
                      if 'xml' in path:
                          root=ET.fromstring(body)
                          locs=[x.text for x in root.findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
                          result.update(root=root.tag,urls=len(locs),noncanonical=[u for u in locs if not u or not u.startswith('https://koliotamerika.bg/')],first_urls=locs[:3])
                      else: result['body']=body.decode()
                      return result
              except Exception as e: return {'path':path,'user_agent':ua,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for result in pool.map(http,requests): print('HTTP',json.dumps(result),flush=True)
          PY
