name: Domain connection check
on:
  push:
    branches: ['codex/domain-connection-check']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public Eridan OpenAPI schema
        run: |
          python3 - <<'PY'
          import urllib.request,json
          with urllib.request.urlopen('https://catalog.eridan.software/api/openapi.json',timeout=30) as r:
              doc=json.load(r)
              print('OPENAPI_STATUS',r.status)
          print('API_INFO',json.dumps({'openapi':doc.get('openapi'),'info':doc.get('info'),'servers':doc.get('servers'),'security':doc.get('security'),'auth':doc.get('components',{}).get('securitySchemes')},ensure_ascii=False))
          for path,methods in doc.get('paths',{}).items():
              for method,op in methods.items():
                  if isinstance(op,dict):
                      print('ENDPOINT',json.dumps({'path':path,'method':method,'summary':op.get('summary'),'description':op.get('description'),'security':op.get('security'),'parameters':op.get('parameters'),'requestBody':op.get('requestBody'),'responses':op.get('responses')},ensure_ascii=False))
          print('SCHEMAS',json.dumps({k:list(v.get('properties',{})) for k,v in doc.get('components',{}).get('schemas',{}).items()}))
          PY
