name: Read-only domain connection diagnostics
on:
  push:
    branches: ['codex/domain-connection-check']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect current parent delegation and recursive NS answers
        run: |
          python3 - <<'PY'
          import concurrent.futures, subprocess, json, datetime
          print('CHECKED '+datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          def query(item):
           server,typ,recursive=item
           command=['dig','@'+server,'koliotamerika.bg',typ,'+time=3','+tries=1']
           if not recursive: command.append('+norecurse')
           try:
            p=subprocess.run(command,capture_output=True,text=True,timeout=12)
            print('DNS_CHECK '+json.dumps({'server':server,'type':typ,'output':p.stdout,'error':p.stderr}),flush=True)
           except Exception as e: print('ERROR '+str(e),flush=True)
          queries=[(s,'NS',r) for s,r in [('a.nic.bg',False),('b.nic.bg',False),('8.8.8.8',True),('1.1.1.1',True),('atlas.dns-parking.com',False),('hyperion.dns-parking.com',False)]]
          queries += [(s,t,False) for s in ['atlas.dns-parking.com','hyperion.dns-parking.com'] for t in ['A','MX']]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool: list(pool.map(query,queries))
          
          PY
