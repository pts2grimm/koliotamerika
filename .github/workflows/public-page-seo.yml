name: Public page SEO inventory
on:
  push:
    branches: ['codex/verify-hostinger-redeploy']
    paths: ['scripts/audit-public-page-seo.py']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/audit-public-page-seo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-page-seo-inventory
          path: seo-audit
