name: Titan SMTP regression checks
on:
  push:
    branches: ['codex/titan-smtp-diagnostics-2026-10-14']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: Check installed mail transport support
        run: |
          node --input-type=module <<'JS'
          import { createRequire } from 'node:module';
          import { readFileSync } from 'node:fs';
          const require = createRequire(import.meta.url);
          const source = readFileSync(require.resolve('nodemailer/lib/shared'), 'utf8');
          console.log('Nodemailer version:', require('nodemailer/package.json').version);
          if (!source.includes('allowInternalNetworkInterfaces')) throw new Error('Installed Nodemailer lacks interface option');
          const lines = source.split('\n');
          for (let i = 0; i < lines.length; i++) {
            if (/Failed to resolve IPv4|allowInternalNetworkInterfaces/.test(lines[i])) console.log(lines.slice(Math.max(0, i-3), i+5).join('\n'));
          }
          JS
      - run: npm test
      - run: npm run build
        env:
          PREVIEW_MODE: 'true'
          PAYLOAD_SECRET: isolated-smtp-ci-not-live-secret
      - run: npm run typecheck
