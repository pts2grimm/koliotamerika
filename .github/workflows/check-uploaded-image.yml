name: Uploaded image persistence check
on:
  push:
    branches: ['codex/verify-hostinger-redeploy']
    paths: ['scripts/check-uploaded-image.py']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests Pillow
      - run: python scripts/check-uploaded-image.py
