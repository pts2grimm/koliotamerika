name: Read-only live Eridan launch audit
on:
  push:
    branches: ['codex/eridan-live-audit-2026-10-14']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: node scripts/audit-live-eridan.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eridan-audit
          path: reports/live-eridan-audit.json
