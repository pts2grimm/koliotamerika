name: Eridan seller filter verification
on:
  push:
    branches: ['codex/eridan-seller-without-model']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --include=dev
      - run: npx tsx --test tests/eridan.test.ts tests/auction-filter-urls.test.ts tests/auction-sections.test.ts
      - run: node --import tsx scripts/check-eridan-seller-without-model.ts
        if: contains(github.event.head_commit.message, '[seller-live]')
        env:
          ERIDAN_API_KEY: ${{ secrets.ERIDAN_API_KEY }}
