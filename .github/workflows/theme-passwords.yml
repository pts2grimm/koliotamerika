name: Theme and password checks
on:
  push:
    branches: [codex/theme-passwords]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Read installed Next.js guides
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync } from 'node:fs';
          const root = 'node_modules/next/dist/docs';
          for (const file of readdirSync(root, { recursive: true }).filter(p => /server-and-client-components|scripts\.md|css\.md/.test(p) && p.startsWith('01-app'))) {
            console.log('GUIDE: ' + file);
            console.log(readFileSync(root + '/' + file, 'utf8'));
          }
          JS
