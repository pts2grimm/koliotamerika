name: Public SEO audit
on:
  push:
    branches: [codex/seo-audit-2026-10-11]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/public-seo-audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-seo-audit-2026-10-11
          path: seo-audit
