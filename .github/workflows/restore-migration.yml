name: Restore migration verification
on:
  push:
    branches: ['codex/restore-migration-urls']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Read installed Next.js contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('node_modules/next/dist/docs/01-app').rglob('*.md'):
            if p.name in ['proxy.md', 'redirects.md', 'sitemap.md', 'static-assets.md']:
              s=p.read_text()
              if p.name=='proxy.md':
                start=s.find('skipTrailingSlashRedirect')
                s=s[max(0,start-1200):start+8500]
              print('FILE '+str(p)+'\n'+s[:20000])
          PY
