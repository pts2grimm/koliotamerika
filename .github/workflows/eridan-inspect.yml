name: Inspect Eridan gallery and vehicle scope
on:
  push:
    branches: ['eridan-staging']
    paths: ['.github/workflows/eridan-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify image availability filter and selected lot
        env:
          ERIDAN_API_KEY: ${{ secrets.ERIDAN_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          base='https://catalog.eridan.software/api'
          def get(path,p={}):
              req=urllib.request.Request(base+path+('?' + urllib.parse.urlencode(p,doseq=True) if p else ''),headers={'Accept':'application/json','Authorization':'Bearer '+os.environ['ERIDAN_API_KEY']})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  print('HTTP_ERROR',path,e.code);return {}
          for site in ['copart','iaai']:
              for p in [{'has_images':'true'},{'has_images':'true','ordering':'-updated_at'},{'ordering':'-updated_at'}]:
                  d=get('/lots',{'auction':site,'item_type':'VEHTYPE_V','page_size':6,**p})
                  print('IMAGE_FILTER',site,p,[(r.get('lot_number'),len(r.get('images') or []),bool(r.get('thumb_url')),r.get('item_type')) for r in d.get('items',[])])
          for p in [{'item_type':'VEHTYPE_M','has_images':'true'},{'vehicle_type__code':'VEHTYPE_M','has_images':'true'},{'vehicle_type__code':'VEHTYPE_V','has_images':'true'}]:
              d=get('/lots',{'page_size':4,**p})
              print('TYPE_FILTER',p,[(r.get('make'),r.get('model'),r.get('item_type'),len(r.get('images') or [])) for r in d.get('items',[])])
          d=get('/lots',{'lot_number':'65871826','auction':'copart','ordering':'-updated_at','page_size':10})
          print('STAGE_LOT',[(r['id'],r['lot_number'],len(r.get('images') or []),r.get('created_at'),r.get('updated_at')) for r in d.get('items',[])])
          if d.get('items'):
              r=get('/lots/'+str(d['items'][0]['id']))
              print('STAGE_LOT_DETAIL',len(r.get('images') or []),list(r))
          d=get('/models',{'make__name':'BMW','page_size':1000})
          print('BMW_MODELS_SAMPLE',[r.get('name') for r in d.get('items',[])][:80])
          
          PY
