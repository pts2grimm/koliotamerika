name: Inspect Eridan gallery and vehicle scope
on:
  push:
    branches: ['eridan-staging']
    paths: ['.github/workflows/eridan-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify repeated make query contract
        env:
          ERIDAN_API_KEY: ${{ secrets.ERIDAN_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          base='https://catalog.eridan.software/api'
          def get(params):
              req=urllib.request.Request(base+'/lots?'+urllib.parse.urlencode(params,doseq=True),headers={'Accept':'application/json','Authorization':'Bearer '+os.environ['ERIDAN_API_KEY']})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
              except urllib.error.HTTPError as e: print('HTTP_ERROR',e.code);return {}
          for p in [{'make__name':'BMW'},{'makes':['BMW']},{'makes':['BMW','HONDA']},{'makes':['BMW','ZERO']},{'makes':'BMW,HONDA'},{'make__name':'HONDA'}]:
              d=get({'item_type':'VEHTYPE_M','has_images':'true','page_size':4,**p})
              print('MAKE_FILTER',p,{'next':d.get('has_next'),'items':[(r.get('make'),r.get('model'),r.get('item_type'),len(r.get('images') or [])) for r in d.get('items',[])]})
          d=get({'lot_number':'65806586','auction':'copart','ordering':'-updated_at','page_size':10})
          print('REPORTED_LOT',[(r['lot_number'],len(r.get('images') or []),bool(r.get('thumb_url'))) for r in d.get('items',[])])
          
          PY
