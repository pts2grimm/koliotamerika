name: Sea transport page review
on:
  push:
    branches: ['codex/sea-transport-page']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Read installed Next documentation
        run: |
          rg --files node_modules/next/dist/docs | rg '(components/.*image|json-ld)\\.(md|mdx)
      - run: npx playwright install --with-deps chromium
      - name: Inspect live transport page
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          const browser=await chromium.launch();
          const page=await browser.newPage();
          await page.route(/https:\/\/(?:www\.googletagmanager\.com|connect\.facebook\.net|www\.clarity\.ms)\//,route=>route.fulfill({contentType:'application/javascript',body:''}));
          try {
            const response=await page.goto('https://papayawhip-ram-220810.hostingersite.com/morski-transport-na-avtomobili-ot-sasht',{waitUntil:'domcontentloaded',timeout:45000});
            console.log('LIVE_STATUS',response?.status());
            const cookie=page.getByRole('button',{name:'Само необходимите',exact:true});
            if(await cookie.isVisible())await cookie.click();
            console.log('LIVE_CONTENT',await page.locator('main').innerText());
            console.log('LIVE_META',await page.evaluate(()=>({title:document.title,description:document.querySelector('meta[name=description]')?.content,canonical:document.querySelector('link[rel=canonical]')?.href})));
            for(const width of [390,1440]){
              await page.setViewportSize({width,height:950});await page.waitForTimeout(500);
              console.log('SEA_BEFORE_'+width+' '+(await page.screenshot({type:'jpeg',quality:45})).toString('base64'));
              console.log('LIVE_WIDTH',await page.evaluate(()=>({viewport:innerWidth,width:document.documentElement.scrollWidth})));
            }
          }catch(error){console.log('LIVE_UNAVAILABLE',error.message)}
          finally{await browser.close()}
          JS
