name: Content and link verification
on:
  push:
    branches: ['codex/content-links']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npx tsx --test tests/content-review.test.ts
      - run: npm test
      - run: npm run build
        env:
          PREVIEW_MODE: 'true'
          PAYLOAD_SECRET: ci-content-review-only-not-live-secret
      - run: npm run typecheck
