name: BOS verification
on:
  push:
    branches: ['codex/bos-documents-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Generate Payload artifacts
        run: npm run generate:types && npm run generate:importmap
        env:
          PREVIEW_MODE: 'true'
          PAYLOAD_SECRET: isolated-bos-ci-not-a-live-secret
      - name: Verify generated files are committed
        run: git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js'
      - run: npx tsx --test tests/bos.test.ts
      - run: npm run build
        env:
          PREVIEW_MODE: 'true'
          PAYLOAD_SECRET: isolated-bos-ci-not-a-live-secret
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: BOS browser and PDF checks
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { spawnSync } from 'node:child_process';
          const result=spawnSync('npx',['playwright','test','--config=playwright.bos.config.ts','--reporter=line'],{stdio:'inherit',env:{...process.env,CHROMIUM_PATH:chromium.executablePath()}});
          process.exit(result.status??1);
          JS
      - name: Render and inspect PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pdftoppm -jpeg -scale-to 1400 -singlefile test-results/bos.pdf test-results/bos-preview
          pdftotext -layout test-results/bos.pdf test-results/bos.txt
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const text=readFileSync('test-results/bos.txt','utf8');
          for(const value of ['Петър Тестов','HWY 17 AUTO SALES','Shipping to Rotterdam','6,400.00','5,400.00','WBA3A5C50DF123456']) if(!text.includes(value)) throw new Error('Missing PDF text: '+value);
          JS
      - name: Export generated artifacts
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {existsSync,readFileSync,globSync} from 'node:fs';
          for(const path of ['src/payload-types.ts','src/app/(payload)/admin/importMap.js']) if(existsSync(path)) console.log('BOS_FILE '+JSON.stringify({path,content:readFileSync(path,'utf8')}));
          for(const path of ['test-results/bos-preview.jpg','test-results/bos-admin.jpg','test-results/bos-settlement.jpg',...globSync('test-results/**/test-failed-*.png')]) if(existsSync(path)) console.log('REVIEW_IMAGE '+JSON.stringify({path,base64:readFileSync(path).toString('base64')}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bos-results
          path: |
            test-results
            src/payload-types.ts
            src/app/(payload)/admin/importMap.js
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npx tsx --test tests/migrations.test.ts
