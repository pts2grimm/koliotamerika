name: Eridan catalogue probe
on:
  push:
    branches: ['codex/eridan-seller-filter-urls']
permissions:
  contents: read
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[catalogue-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: node --import tsx scripts/check-eridan-catalogue-probe.ts
        env:
          ERIDAN_API_KEY: ${{ secrets.ERIDAN_API_KEY }}
