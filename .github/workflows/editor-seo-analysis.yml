name: Editor SEO analysis verification
on:
  push:
    branches: ['codex/editor-seo-analysis-2026-10-26']
permissions:
  contents: read
concurrency:
  group: editor-seo-analysis
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
      DATABASE_PROVIDER: postgres
      DATABASE_URI: postgresql://postgres:isolated-test-only@127.0.0.1:5432/postgres
      PAYLOAD_SECRET: homepage-fixture-not-production
      PAYLOAD_MIGRATING: 'true'
      PREVIEW_MODE: 'false'
      CUSTOMER_ACCOUNTS_ENABLED: 'true'
      ALLOW_ADMIN_SETUP: 'true'
      SITE_INDEXABLE: 'false'
      NEXT_PUBLIC_SERVER_URL: http://localhost:3100
      MEDIA_DIR: /tmp/koa-home-media
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run generate:types
      - run: npm run generate:importmap
      - name: Check generated source
        run: git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js'
      - run: node --import tsx --test tests/editor-seo-analysis.test.ts tests/page-seo.test.ts
      - run: node --import tsx scripts/prepare-postgres.ts
      - run: node --import tsx tests/fixtures/homepage.ts
      - run: node --import tsx tests/fixtures/homepage.ts
        env:
          DATABASE_PROVIDER: sqlite
          DATABASE_URI: file:/tmp/koa-home-fixture.db
      - run: node --import tsx tests/fixtures/editor-seo.ts
      - run: node --import tsx tests/fixtures/editor-seo.ts
        env:
          DATABASE_PROVIDER: sqlite
          DATABASE_URI: file:/tmp/koa-home-fixture.db
      - run: npm run build
      - run: npm run typecheck
      - run: google-chrome --version
      - run: npx playwright test --config=playwright.editor-seo.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: editor-seo-test-results
          path: test-results/
          retention-days: 5
