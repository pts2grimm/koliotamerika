name: Supabase connection preflight
on:
  push:
    branches: ['codex/supabase-check-2026-10-22']
permissions:
  contents: read
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PostgreSQL client in temporary workspace
        run: |
          mkdir -p "$RUNNER_TEMP/supabase-check"
          cd "$RUNNER_TEMP/supabase-check"
          npm install --ignore-scripts --no-audit --no-fund pg@8.16.3 @libsql/client@0.14.0
      # Public root CA URL used by Supabase Studio's Download certificate button.
      - name: Download official Supabase root certificate over verified HTTPS
        run: |
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 \
            'https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt' \
            --output "$RUNNER_TEMP/supabase-check/supabase-ca.crt"
      - name: Verify TLS connection and inspect empty target (read only)
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
          SOURCE_DATABASE_URI: ${{ secrets.DATABASE_URI }}
          SOURCE_DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/supabase-check"
          node --input-type=module <<'JS'
          import pg from 'pg';
          import { readFileSync } from 'node:fs';
          const raw=process.env.SUPABASE_DATABASE_URL;
          console.log('Target secret configured:',Boolean(raw));
          console.log('Source DATABASE_URI configured:',Boolean(process.env.SOURCE_DATABASE_URI));
          console.log('Source DATABASE_AUTH_TOKEN configured:',Boolean(process.env.SOURCE_DATABASE_AUTH_TOKEN));
          if(!raw){console.log('BLOCKED: SUPABASE_DATABASE_URL is missing.');process.exit(1);}
          let url;
          try{url=new URL(raw);}catch{console.log('BLOCKED: invalid connection URL.');process.exit(1);}
          const project='jiyjkhdcngzpvdxbiprs';
          const direct=url.hostname==='db.'+project+'.supabase.co';
          const pooler=url.hostname.endsWith('.pooler.supabase.com')&&decodeURIComponent(url.username)==='postgres.'+project;
          if(!['postgres:','postgresql:'].includes(url.protocol)||(!direct&&!pooler)||url.port&&url.port!=='5432'||url.pathname!=='/postgres'||!url.password||decodeURIComponent(url.password).includes('[YOUR-PASSWORD]')){
            console.log('BLOCKED: use this project’s PostgreSQL Session pooler URL, port 5432, database postgres, and the actual database password.');process.exit(1);
          }
          for(const key of ['sslmode','sslcert','sslkey','sslrootcert'])url.searchParams.delete(key);
          const client=new pg.Client({connectionString:url.toString(),ssl:{rejectUnauthorized:true,ca:process.env.SUPABASE_CA_CERT||readFileSync('supabase-ca.crt','utf8')},connectionTimeoutMillis:15000,statement_timeout:15000,application_name:'koa-readonly-preflight'});
          try{
            await client.connect();
            await client.query('BEGIN READ ONLY');
            // pg_stat_ssl describes the pooler's backend connection, not our TLS socket.
            const socket=client.connection.stream;
            if(socket.encrypted!==true||socket.authorized!==true)throw Object.assign(new Error(),{code:'TLS_REQUIRED'});
            const tables=await client.query("SELECT COUNT(*)::int AS count FROM information_schema.tables WHERE table_schema IN ('public','payload') AND table_type='BASE TABLE'");
            console.log('Connected to expected Supabase project with verified TLS.');
            console.log('Application tables in public/payload:',tables.rows[0].count);
            console.log('No schema or data changes performed.');
            await client.query('ROLLBACK');
          }catch(error){
            const codes=new Set(['28P01','28000','3D000','42501','ENOTFOUND','ECONNREFUSED','ETIMEDOUT','ENETUNREACH','SELF_SIGNED_CERT_IN_CHAIN','DEPTH_ZERO_SELF_SIGNED_CERT','UNABLE_TO_VERIFY_LEAF_SIGNATURE','CERT_HAS_EXPIRED','TLS_REQUIRED']);
            console.log('Connection failed:',codes.has(error.code)?error.code:'CONNECTION_ERROR');
            process.exitCode=1;
          }finally{await client.end().catch(()=>{});}
          JS
      - name: Inspect current Turso database (read only, counts only)
        env:
          SOURCE_DATABASE_URI: ${{ secrets.DATABASE_URI }}
          SOURCE_DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/supabase-check"
          node --input-type=module <<'JS'
          import { createClient } from '@libsql/client';
          const raw=process.env.SOURCE_DATABASE_URI;
          const token=process.env.SOURCE_DATABASE_AUTH_TOKEN;
          if(!raw||!token){console.log('BLOCKED: source DATABASE_URI or DATABASE_AUTH_TOKEN is missing.');process.exit(1);}
          let url;
          try{url=new URL(raw);}catch{console.log('BLOCKED: invalid source database URL.');process.exit(1);}
          if(!['libsql:','https:'].includes(url.protocol)||!url.hostname.endsWith('.turso.io')){
            console.log('BLOCKED: expected secure Turso database URL.');process.exit(1);
          }
          let client,tx;
          try{
            client=createClient({url:raw,authToken:token});
            tx=await client.transaction('read');
            const tables=await tx.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name");
            const names=new Set(tables.rows.map(row=>String(row.name)));
            console.log('Source Turso connection succeeded in read-only transaction.');
            console.log('Source application table count:',names.size);
            const expected=['users','customers','pages','media','inquiries','bills_of_sale','invoices','site_settings','integrations','payload_migrations'];
            for(const name of expected){
              if(!names.has(name)){console.log('Expected table absent:',name);continue;}
              const result=await tx.execute('SELECT COUNT(*) AS count FROM "'+name+'"');
              console.log('Source row count:',name,String(result.rows[0].count));
            }
            await tx.rollback();
            console.log('Source check complete; no schema or data changes performed.');
          }catch(error){
            const allowed=new Set(['AUTH_FAILED','SERVER_ERROR','SQLITE_AUTH','SQLITE_NOTADB','SQLITE_CORRUPT','SQLITE_BUSY','SQLITE_ERROR','URL_INVALID','URL_SCHEME_NOT_SUPPORTED','HRANA_WEBSOCKET_ERROR','FETCH_ERROR']);
            console.log('Source check failed:',allowed.has(error.code)?error.code:'SOURCE_CONNECTION_ERROR');
            process.exitCode=1;
          }finally{
            if(tx&&!tx.closed)await tx.rollback().catch(()=>{});
            client?.close();
          }
          JS
